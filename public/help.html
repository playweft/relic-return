<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>归核 · 操作说明</title><body style="max-width:720px;margin:60px auto;padding:20px;background:#101e23;color:#d0e2d8;font:16px/1.9 system-ui"><h1>归核 · 遗迹冒险</h1><p>WASD 移动；鼠标拖动或方向键调整镜头；空格跳跃；鼠标左键单击或 J 攻击；Shift 闪避；E 交互；Esc 暂停。</p><p>从营地向北进入中庭，再向西找到金色钥匙。回中庭向北，用钥匙开启蓝色封印。观察守卫的红圈前摇，闪避后反击，三次命中即可击败。取得北侧核心，再沿原路回营地按 E 交付。</p><p>三个阶段使用同一世界和操作。初探无陷阱，遗迹加入周期陷阱，试炼缩短守卫前摇。跳跃能越过陷阱，闪避期间短暂无敌。跌落扣除生命并回到中庭。五分钟未完成将结束，结算可导出伤害来源和行动事件。</p><a style="color:#edc582" href="./">返回游戏</a></body></html>
